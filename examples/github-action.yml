name: test

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx failure-packager --output failure-report.md --json failure-report.json -- npm test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: failure-report
          path: |
            failure-report.md
            failure-report.json
